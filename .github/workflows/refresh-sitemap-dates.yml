name: Refresh sitemap last-modified dates

on:
  workflow_dispatch:
  push:
    # Refresh route dates on feature branches as well as main, so a batch can be validated before merge.
    paths:
      - 'app/**/page.tsx'
      - 'app/sitemap.ts'
      - 'components/**'
      - 'lib/**'
      - 'scripts/generate-sitemap-dates.mjs'
      - 'SEO-CHANGELOG.md'
      - 'docs/**'

permissions:
  contents: write

jobs:
  refresh-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate sitemap dates and route inventory
        run: |
          node scripts/generate-sitemap-dates.mjs
          node scripts/route-inventory.mjs
      - name: Commit generated dates when changed
        run: |
          if git diff --quiet -- lib/sitemap-dates.ts docs/ROUTE-INVENTORY.md; then
            echo "Sitemap dates are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sitemap-dates.ts docs/ROUTE-INVENTORY.md
          git commit -m "chore: refresh generated route metadata"
          git push
