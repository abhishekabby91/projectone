name: Refresh sitemap last-modified dates

on:
  workflow_dispatch:
  push:
    branches: [main, accounstone-seo-improvements]
    paths:
      - 'app/**/page.tsx'
      - 'app/sitemap.ts'
      - 'components/**'
      - 'lib/**'
      - 'scripts/generate-sitemap-dates.mjs'
      - '.github/workflows/refresh-sitemap-dates.yml'

permissions:
  contents: write

jobs:
  refresh-dates:
    runs-on: ubuntu-latest
    steps:
      - name: Check out full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate sitemap dates from page history
        run: node scripts/generate-sitemap-dates.mjs
      - name: Commit generated dates when changed
        run: |
          if git diff --quiet -- lib/sitemap-dates.ts; then
            echo "Sitemap dates are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/sitemap-dates.ts
          git commit -m "chore: refresh generated sitemap dates"
          git push
