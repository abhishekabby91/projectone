name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.mjs"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 90

      - name: Submit production sitemap URLs to IndexNow
        shell: bash
        run: |
          set -euo pipefail
          KEY="e6183ad7c7794fe1a98a2b89634c01c9"
          python - <<'PY'
          import os, urllib.request, xml.etree.ElementTree as ET, json
          key=os.environ['INDEXNOW_KEY']
          with urllib.request.urlopen('https://www.accounstone.com/sitemap.xml',timeout=30) as r: data=r.read()
          root=ET.fromstring(data); ns={'sm':'http://www.sitemaps.org/schemas/sitemap/0.9'}
          urls=[x.text for x in root.findall('.//sm:loc',ns) if x.text]
          if not urls: raise SystemExit('No URLs found in production sitemap.')
          payload={'host':'www.accounstone.com','key':key,'keyLocation':f'https://www.accounstone.com/{key}.txt','urlList':urls[:10000]}
          req=urllib.request.Request('https://api.indexnow.org/indexnow',data=json.dumps(payload).encode(),headers={'Content-Type':'application/json; charset=utf-8'},method='POST')
          with urllib.request.urlopen(req,timeout=30) as r: print(f'IndexNow response: HTTP {r.status}')
          PY
        env:
          INDEXNOW_KEY: e6183ad7c7794fe1a98a2b89634c01c9