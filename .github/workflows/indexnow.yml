name: Notify IndexNow

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "next.config.mjs"

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 180

      - name: Submit production sitemap URLs to IndexNow
        shell: bash
        env:
          INDEXNOW_KEY: e6183ad7c7794fe1a98a2b89634c01c9
          SITE_URL: https://www.accounstone.com
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          site_url = os.environ["SITE_URL"].rstrip("/")
          key = os.environ["INDEXNOW_KEY"]

          sitemap_url = f"{site_url}/sitemap.xml"
          key_location = f"{site_url}/{key}.txt"

          def get(url):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Accounstone-IndexNow/1.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  return response.read()

          sitemap_data = get(sitemap_url)
          key_data = get(key_location).decode("utf-8").strip()

          if key_data != key:
              raise SystemExit(
                  f"IndexNow key file mismatch: expected {key}, got {key_data!r}"
              )

          root = ET.fromstring(sitemap_data)
          namespace = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [
              node.text.strip()
              for node in root.findall(".//sm:loc", namespace)
              if node.text and node.text.strip()
          ]

          if not urls:
              raise SystemExit("No URLs found in production sitemap.")

          payload = {
              "host": "www.accounstone.com",
              "key": key,
              "keyLocation": key_location,
              "urlList": urls[:10000],
          }

          request = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json; charset=utf-8",
                  "User-Agent": "Accounstone-IndexNow/1.0",
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=60) as response:
                  print(f"IndexNow response: HTTP {response.status}")
          except urllib.error.HTTPError as error:
              body = error.read().decode("utf-8", errors="replace")
              raise SystemExit(
                  f"IndexNow request failed: HTTP {error.code} {body}"
              )

          print(f"Submitted {len(urls)} sitemap URLs to IndexNow.")
          PY
